name: MART Research Offline Validation
on:
  push:
    branches:
      - research/telegram-menu-repair-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test staging Cloudflare Worker (offline)
        run: node --test cloudflare/test-mart-staging.mjs
      - name: Compile Python sources
        run: python -m compileall -q scripts tests app.py update_journal.py campaigns.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
