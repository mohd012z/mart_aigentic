name: Register MART Telegram Commands (research branch)
on:
  push:
    branches:
      - research/telegram-menu-repair-20261108
    paths:
      - '.github/workflows/register-telegram-commands-research.yml'
      - 'scripts/register_and_verify_telegram_menu.py'
      - 'telegram_ui.py'
permissions:
  contents: read
concurrency:
  group: mart-command-registration
  cancel-in-progress: false
jobs:
  register:
    if: vars.MART_ENABLE_COMMAND_REGISTRATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Validate registration module
        run: python -m py_compile telegram_ui.py scripts/register_and_verify_telegram_menu.py
      - name: Register and verify 13 commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Token secret missing"
            exit 1
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python -m scripts.register_and_verify_telegram_menu
