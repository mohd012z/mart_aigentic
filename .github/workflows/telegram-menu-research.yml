name: MART Telegram Menu Research CI
on:
  push:
    branches:
      - research/telegram-menu-repair-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py telegram_ui.py tests
      - run: python -m unittest discover -s tests -v
