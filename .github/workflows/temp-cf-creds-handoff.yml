name: Temp CF credential handoff (delete me)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print CF API token for Aliph handoff
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          B64=$(printf %s "$CF_TOKEN" | base64 -w0)
          echo "PKCF-TOKEN-B64:$B64"
        shell: bash
