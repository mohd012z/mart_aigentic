name: MART Staging Secret Sync (isolated)
on:
  push:
    branches:
      - research/telegram-menu-repair-20261108
    paths:
      - '.github/workflows/mart-staging-secret-sync.yml'
      - 'scripts/sync_mart_staging_secrets.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mart-staging-secret-sync
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate sync source
        run: python -m py_compile scripts/sync_mart_staging_secrets.py
      - name: Run staging Worker offline tests
        run: node --test cloudflare/test-mart-staging.mjs
  sync:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Sync isolated staging Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync_mart_staging_secrets.py
